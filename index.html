<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Partes digitales</title>
    <link rel="stylesheet" href="/styles.css">
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <div>
          <p class="eyebrow">Partes digitales</p>
          <h1>Registro de trabajo</h1>
        </div>
        <div class="topbar-actions">
          <button class="button secondary" id="newPartButton" type="button">Nuevo</button>
        </div>
      </header>

      <main class="layout">
        <section class="panel form-panel" aria-labelledby="formTitle">
          <div class="section-heading">
            <h2 id="formTitle">Parte</h2>
            <span id="saveState" class="state-pill">Sin guardar</span>
          </div>

          <form id="partForm" autocomplete="off">
            <input id="partId" type="hidden">

            <div class="grid two">
              <label>
                <span>Fecha</span>
                <input id="fecha" name="fecha" type="date" required>
              </label>
              <div class="field-group technicians-field">
                <div class="field-label-row">
                  <span>Técnicos</span>
                  <button class="button text-button" id="addTechnicianButton" type="button">Añadir técnico</button>
                </div>
                <div id="techniciansList" class="technicians-list"></div>
              </div>
            </div>

            <div class="grid two">
              <label>
                <span>Cliente</span>
                <input id="cliente" name="cliente" type="text" required>
              </label>
              <label>
                <span>Instalación / ubicación</span>
                <input id="direccion" name="direccion" type="text">
              </label>
            </div>

            <div class="field-group service-field">
              <span>Tipo de servicio</span>
              <div class="radio-group" role="radiogroup" aria-label="Tipo de servicio">
                <label class="radio-row">
                  <input name="tipoServicio" type="radio" value="Presupuesto">
                  <span>Presupuesto</span>
                </label>
                <label class="radio-row">
                  <input name="tipoServicio" type="radio" value="Administración">
                  <span>Administración</span>
                </label>
                <label class="radio-row">
                  <input name="tipoServicio" type="radio" value="Avería">
                  <span>Avería</span>
                </label>
              </div>
            </div>

            <div class="grid four">
              <label>
                <span>Año OT</span>
                <input id="anioOt" name="anioOt" type="number" min="2000" max="2100" inputmode="numeric">
              </label>
              <label>
                <span>OT</span>
                <input id="ot" name="ot" type="text">
              </label>
              <label>
                <span>Hora inicio</span>
                <input id="horaInicio" name="horaInicio" type="time" required>
              </label>
              <label>
                <span>Hora final</span>
                <input id="horaFinal" name="horaFinal" type="time" required>
              </label>
            </div>

            <div class="grid two">
              <label>
                <span>Horas jornada</span>
                <input id="horasJornada" name="horasJornada" type="number" min="0" step="0.25" inputmode="decimal" required>
              </label>
              <label>
                <span>Horas adicionales</span>
                <input id="horasUrgencia" name="horasUrgencia" type="number" min="0" step="0.25" inputmode="decimal">
              </label>
            </div>

            <label>
              <span>Descripción trabajo</span>
              <textarea id="descripcion" name="descripcion" rows="5" required></textarea>
            </label>

            <label>
              <span>Obs.</span>
              <textarea id="observaciones" name="observaciones" rows="4"></textarea>
            </label>

            <div class="options-grid">
              <label class="check-row">
                <input id="almuerzo" name="almuerzo" type="checkbox">
                <span>Almuerzo</span>
              </label>
              <label class="check-row">
                <input id="comida" name="comida" type="checkbox">
                <span>Comida</span>
              </label>
              <label>
                <span>T. comida</span>
                <select id="tiempoComida" name="tiempoComida">
                  <option value=""></option>
                  <option value="30">30</option>
                  <option value="60">60</option>
                  <option value="90">90</option>
                </select>
              </label>
              <label>
                <span>KM</span>
                <input id="km" name="km" type="number" min="0" step="1" inputmode="numeric">
              </label>
              <label>
                <span>Prima</span>
                <select id="prima" name="prima">
                  <option value=""></option>
                  <option value="Si">Si</option>
                  <option value="No">No</option>
                </select>
              </label>
              <label class="check-row">
                <input id="busca" name="busca" type="checkbox">
                <span>Busca</span>
              </label>
              <label class="check-row">
                <input id="nocturnidad" name="nocturnidad" type="checkbox">
                <span>Nocturnidad</span>
              </label>
            </div>

            <div class="form-actions">
              <button class="button primary" type="submit">Guardar parte</button>
            </div>
          </form>
        </section>

        <aside class="panel list-panel" aria-labelledby="listTitle">
          <div class="section-heading">
            <h2 id="listTitle">Estado</h2>
            <span id="partCount" class="count">Sheets</span>
          </div>
          <label class="search-label">
            <span>Buscar</span>
            <input id="searchInput" type="search" placeholder="Estado de conexión" readonly>
          </label>
          <div id="partsList" class="parts-list"></div>
        </aside>
      </main>
    </div>

    <section id="printArea" class="print-area" aria-hidden="true"></section>

    <script src="./config.js"></script>
    <script src="./app.js"></script>
  </body>
</html>
